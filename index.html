<!DOCTYPE html>
<html lang="id">
<head>
    <meta http-equiv="refresh" content="5;url=https://s.shopee.co.id/3LPQgQ6NUw">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDEY</title>
    <style>
        /* Mengatur latar belakang halaman */
        body {
            margin: 0;
            padding: 20px 0; /* Memberikan sedikit ruang atas & bawah jika halaman di-scroll */
            background-color: #121212; /* Warna gelap agar fokus ke video */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Kontainer Utama Video & Banner */
        .video-wrapper {
            width: 100%;
            max-width: 450px; /* Batas maksimal lebar agar proporsional */
            background-color: #000;
            border-radius: 12px; /* Membuat sudut video sedikit melengkung rapi */
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        /* Mengatur Video HTML5 agar Responsif */
        .video-wrapper video {
            width: 100%;
            display: block;
            object-fit: contain; /* Menjaga rasio video asli */
        }

        /* Wadah Khusus Banner di Bawah Video */
        .banner-container {
            width: 100%;
            padding: 10px 0;
            text-align: center;
            background-color: #1e1e1e; /* Sedikit pembeda warna background banner */
        }
    </style>
</head>
<body>

<div class="video-wrapper">
    <!-- Pemutar Video -->
    <video controls poster="link-gambar-cover.jpg">
        <source src="https://github.com/user-attachments/assets/35602983-7b68-4d5c-8d64-3e9510a5a7e7" type="video/mp4">
        Browser Anda tidak mendukung pemutar video ini.
    </video>

    <!-- Script Banner (Tepat di Bawah Video) -->
    <div class="banner-container">
        <script async="async" data-cfasync="false" src="https://pl30476158.effectivecpmnetwork.com/272d8039cc1aad3514db26baf929dea9/invoke.js"></script>
        <div id="container-272d8039cc1aad3514db26baf929dea9"></div>
    </div>
</div>

</body>
</html>
